name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualidade:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://tinnasilvaharmoniavocal.com.br

      - name: Guardar o site construído
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: out/
          retention-days: 3

      - name: Preparar o site para o GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/

  e2e:
    name: Robot Framework
    # Fixo: o Playwright não instala o Chromium no ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    needs: qualidade
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # A suíte de consentimento precisa de IDs de medição no build: sem eles,
      # o banner não existe (e é assim que a produção roda hoje).
      - name: Construir com medição de teste
        run: |
          npm ci
          npm run build:teste

      - name: Instalar o Robot Framework
        run: |
          pip install -r tests/e2e/requirements.txt
          rfbrowser init chromium

      - name: Servir o site
        run: |
          python -m http.server 4321 --directory out &
          for i in $(seq 1 30); do curl -sf http://localhost:4321/ -o /dev/null && break; sleep 1; done

      - name: Rodar a suíte
        run: robot --outputdir tests/e2e/relatorios tests/e2e

      - name: Guardar o relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-robot
          path: tests/e2e/relatorios/
          retention-days: 7

  lighthouse:
    name: Performance e acessibilidade
    runs-on: ubuntu-latest
    needs: qualidade
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Baixar o site construído
        uses: actions/download-artifact@v4
        with:
          name: site
          path: out

      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.15.x autorun

  publicar:
    name: Publicar no GitHub Pages
    # Só a main publica, e só depois de passar nos testes de ponta a ponta.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [qualidade, e2e]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: publicacao
        uses: actions/deploy-pages@v4
